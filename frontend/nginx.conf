# SPA fallback (every non-file path resolves to index.html, so client-side routing survives a hard refresh on a
# deep link like /projects) plus a long cache for Vite's content-hashed assets - safe because a new build ships a
# new filename, never the same name with different content. index.html itself stays uncached so a deploy is visible
# on the next load rather than the next time a viewer's browser cache expires.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
