spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: intelligence-service

  datasource:
    # A separate logical database on the same local Postgres server the other services use — no shared
    # tables/FKs with account-service's or workspace-service's databases.
    url: jdbc:postgresql://localhost:9010/vibecraft-intelligence-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (db/migration/V1__init.sql) owns the schema, not Hibernate - same fix account-service/workspace-
      # service already applied for the persisted-enum/ddl-auto:update CHECK-constraint trap (docs/schema/).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: x-ai/grok-4.5
          temperature: 0.0
          stream-usage: true
          max-tokens: 32000

usage:
  # What reserveBudget() claims against the daily counter before a build turn starts (UsageServiceImpl). Sized off
  # a real turn's total cost - input included - not spring.ai.openai.chat.options.max-tokens, which is only the
  # model's output ceiling and left an ordinary two-file build (70,294 tokens observed in production) under-
  # reserved by more than 2x. A tool-calling turn resends its whole growing conversation on every round, so input
  # dominates; this is a conservative ceiling for a turn that reads several files across a few rounds, not a tight
  # estimate - the true cost is still trued up afterward by reconcileBudget.
  build-reservation-tokens: 150000

internal-service:
  shared-secret: ${INTERNAL_SERVICE_SHARED_SECRET}

feign:
  client:
    config:
      default:
        # API-05: an unbounded downstream call can stall a request indefinitely - session authentication itself
        # calls account-service (RemoteSessionAuthenticator), so a slow account-service would otherwise stall
        # most requests here. Feign's own bounded Retryer (FeignResilienceConfig, common-lib) only retries a
        # RetryableException (connect/read timeout, connection refused) - never a decoded 4xx/5xx response - so
        # a real downstream failure still surfaces once, not retried blindly.
        connectTimeout: 2000
        readTimeout: 5000

firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}

app:
  auth:
    session-cookie:
      name: vc_session
      max-age: 5d
      secure: true
    revocation-check-interval: 60s

server:
  port: ${INTELLIGENCE_SERVICE_PORT:8083}

# CODE_REVIEW.md DEP-036: liveness/readiness on a separate port from server.port, so Kubernetes probes hit the pod
# directly and /actuator/health is never reachable through this service's own port - no Service or gateway route
# ever forwards to management.server.port. show-details: never keeps the response a bare UP/DOWN, not component
# internals (DB connection state, etc).
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9404}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
