apiVersion: v1
kind: Namespace
metadata:
  # Everything for previews lives here; preview.namespace in application.yaml must match.
  name: vibecraft-ai

---

# Defense in depth for CODE_REVIEW.md SEC-10: every container in k8s/runner-pods.yml and this file already sets its
# own CPU/memory/ephemeral-storage requests and limits, but this is what stops a future manifest change from
# quietly shipping an unbounded container, and what caps the whole namespace's footprint regardless of how many
# runner replicas end up scheduled. It does not bound PIDs per pod - that needs a kubelet `--pod-max-pids` flag or a
# RuntimeClass, both cluster-level settings no namespaced object can express; a fork bomb inside a runner is not
# stopped by anything in this file. Don't treat this as closing SEC-10 by itself.
apiVersion: v1
kind: LimitRange
metadata:
  name: vibecraft-ai-limits
  namespace: vibecraft-ai
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
        ephemeral-storage: "512Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
        ephemeral-storage: "64Mi"
      max:
        cpu: "2"
        memory: "2Gi"
        ephemeral-storage: "4Gi"

---

apiVersion: v1
kind: ResourceQuota
metadata:
  name: vibecraft-ai-quota
  namespace: vibecraft-ai
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: "4Gi"
    limits.cpu: "12"
    limits.memory: "12Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: vibecraft-ai
spec:
  type: ExternalName
  externalName: host.docker.internal # Points to your laptop/host
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-server
  namespace: vibecraft-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: vibecraft-ai
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP