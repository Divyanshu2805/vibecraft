apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibecraft-proxy
  namespace: vibecraft-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibecraft-proxy
  template:
    metadata:
      labels:
        app: vibecraft-proxy
    spec:
      containers:
        - name: proxy
          image: vibecraft-proxy:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: REDIS_URL
              # Refers to the service in the same namespace
              value: "redis://redis-service:6379"
            - name: PREVIEW_ACCESS_TOKEN_SECRET
              # Must be byte-for-byte the same value as the backend's PREVIEW_ACCESS_TOKEN_SECRET (.env) - it's how
              # this proxy verifies the token PreviewAccessToken.java signs (CODE_REVIEW.md SEC-06). Create the
              # Secret once per cluster: kubectl create secret generic preview-access-token -n vibecraft-ai
              # --from-literal=secret='<same value as the backend .env>'
              valueFrom:
                secretKeyRef:
                  name: preview-access-token
                  key: secret
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: vibecraft-proxy-svc
  namespace: vibecraft-ai
spec:
  # Pending forever on kind, which has no load balancer: locally it's reached through k8s/dev-port-forward.ps1.
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: vibecraft-proxy