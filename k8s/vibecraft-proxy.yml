apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibecraft-proxy
  namespace: vibecraft-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibecraft-proxy
  template:
    metadata:
      labels:
        app: vibecraft-proxy
    spec:
      containers:
        - name: proxy
          image: vibecraft-proxy:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: REDIS_URL
              # Refers to the service in the same namespace
              value: "redis://redis-service:6379"
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: vibecraft-proxy-svc
  namespace: vibecraft-ai
spec:
  # Pending forever on kind, which has no load balancer: locally it's reached through k8s/dev-port-forward.ps1.
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: vibecraft-proxy