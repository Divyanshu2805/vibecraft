version: '3.9'

services:
  pgvector:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    container_name: pgvector-vibecraft
    environment:
      # The server's own maintenance database. Each service's database is created by the init script below.
      POSTGRES_DB: postgres
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "9010:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql
      # Creates each service's own database on first-ever container init - see the file's own comment. Only
      # runs against a brand-new data volume; docs/local-development/resetting-data.md, "Resetting local data", has the steps.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-vibecraft
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"    # API
      - "9001:9001"    # Console
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  minio-data:
  pgvector-data: