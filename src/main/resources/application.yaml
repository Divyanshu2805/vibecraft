spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: vibecraft

  datasource:
    url: jdbc:postgresql://localhost:9010/vibecraft-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # Password-reset emails. Locally this is Mailpit from services.docker-compose.yml (no auth, inbox at
  # http://localhost:8025). A real relay's credentials come from SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD in
  # the environment - deliberately not written here, so no placeholder credential ever looks like a working one.
  mail:
    host: localhost
    port: 1025

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: x-ai/grok-4.5
          temperature: 0.0
          stream-usage: true
          # A teaching-mode build of a dozen files runs to tens of thousands of characters, and walkthroughs
          # are about half of that. Without an explicit ceiling the provider's default applied, and a long
          # build simply stopped mid-plan with no error - four files written, eight steps never started.
          max-tokens: 32000

jwt:
  secret-key: ${JWT_SECRET}

# Firebase Authentication (Identity Platform). Every sign-in method - email/password, Google, two-step codes -
# happens against Firebase from the browser; this server only verifies what Firebase issued and turns it into its
# own httpOnly session cookie. Both values have no fallback, like every other secret:
#   FIREBASE_PROJECT_ID        - the Firebase project id (Project settings -> General)
#   FIREBASE_CREDENTIALS_PATH  - path to a service-account JSON key (Project settings -> Service accounts). A file
#                                OUTSIDE this repo: it can mint tokens for any user, so it must never be committed.
firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}

app:
  auth:
    session-cookie:
      name: vc_session
      # Firebase caps session cookies at 14 days. Five keeps a stolen cookie's useful life short without making
      # people sign in every day.
      max-age: 5d
      # Browsers accept Secure cookies on http://localhost, so this stays true in dev too. Only turn it off to
      # test from a non-localhost http origin.
      secure: true
    # How long a verified session is trusted before checking Firebase again for revocation (sign out everywhere,
    # password change, disabled account). The upper bound on how long a revoked session keeps working here.
    revocation-check-interval: 60s
    # The pre-Firebase username/password endpoints (/api/auth/signup, /login, /forgot-password, /reset-password)
    # and Bearer-token requests. Kept only as a rollback path during the migration: they bypass two-step
    # verification, so switch this to false as soon as Firebase sign-in is confirmed working.
    legacy:
      enabled: true
  firebase:
    # One-off: on startup, copy every local user without a Firebase account into Firebase, keeping their BCrypt
    # password hashes so they sign in with the same password. Safe to re-run; leave false otherwise.
    import-users: false

# Legacy (app.auth.legacy.enabled) reset links only - Firebase sends its own reset emails.
password-reset:
  # How long an emailed reset link works. Short on purpose: the link is a password-equivalent sitting in an inbox.
  token-validity: 30m
  mail-from: "VibeCraft <no-reply@vibecraft.dev>"

stripe:
  api:
    secret: ${STRIPE_SECRET}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}
  # The recurring prices the paid plans check out against. Not secret, but env-sourced with no fallback like
  # everything else Stripe-related - a wrong price id here bills the wrong amount, so failing startup beats
  # silently seeding a plan that points nowhere. PlanSeeder upserts the catalogue against these.
  price:
    pro: ${STRIPE_PRICE_PRO}
    business: ${STRIPE_PRICE_BUSINESS}

minio:
  url: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  project-bucket: projects

# Where Stripe sends people back to: the FRONTEND, not this server. It pointed at 8080 - this backend's own
# port - so every successful checkout redirected to a path the API has no route for.
client.url: http://localhost:5173

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG
