spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: workspace-service

  datasource:
    # A separate logical database on the same local Postgres server the other services use — no tables/FKs
    # shared with account-service's vibecraft-account-db or intelligence-service's database.
    url: jdbc:postgresql://localhost:9010/vibecraft-workspace-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (db/migration/V1__init.sql) owns the schema, not Hibernate - same fix account-service already
      # applied for the persisted-enum/ddl-auto:update CHECK-constraint trap (docs/schema/).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

internal-service:
  shared-secret: ${INTERNAL_SERVICE_SHARED_SECRET}

feign:
  client:
    config:
      default:
        # API-05: an unbounded downstream call can stall a request indefinitely - session authentication itself
        # calls account-service (RemoteSessionAuthenticator), so a slow account-service would otherwise stall
        # most requests here. Feign's own bounded Retryer (FeignResilienceConfig, common-lib) only retries a
        # RetryableException (connect/read timeout, connection refused) - never a decoded 4xx/5xx response - so
        # a real downstream failure still surfaces once, not retried blindly.
        connectTimeout: 2000
        readTimeout: 5000

firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}

app:
  auth:
    session-cookie:
      name: vc_session
      max-age: 5d
      secure: true
    revocation-check-interval: 60s

minio:
  url: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  project-bucket: projects
  # Where the starter template a new project is seeded from actually lives - CODE_REVIEW.md DATA-03 flagged these as
  # hardcoded constants living apart from every other bucket name, which does come from configuration.
  template-bucket: starter-projects
  template-name: react-vite-tailwind-daisyui-starter
  # CODE_REVIEW.md AI-05: immutable, content-addressed revision blobs - a dedicated bucket so it is structurally
  # impossible for the K8s preview syncer's `mc mirror` (scoped to project-bucket/{projectId}/) to ever touch it.
  blob-bucket: project-blobs

# CODE_REVIEW.md AI-09: isolated build/typecheck validation on a staged revision before it publishes. Off by
# default - see RevisionValidationProperties' javadoc for why - until real per-turn latency/cluster-load numbers
# justify turning it on. `command` is confirmed against the real starter template's package.json/tsconfig.json,
# not guessed; change it here, not in code, if the template's checks change.
revision-validation:
  enabled: false
  command: npx tsc --noEmit
  install-timeout: 2m
  build-timeout: 2m
  output-max-chars: 8000

# The kind namespace, Redis and MinIO bucket the live-preview pipeline runs against (PreviewRouter's Redis keys
# are per-hostname).
preview:
  namespace: vibecraft-ai
  public-scheme: http
  public-domain: localhost
  public-port: 8090
  runner-port: 5173
  storage-alias: myminio
  bucket: ${minio.project-bucket}
  idle-timeout: 10m
  boot-timeout: 2m
  route-ttl: 90s
  # Signs the short-lived access token appended to every previewUrl this service hands out (SEC-06): a bare
  # hostname is otherwise a permanent, unauthenticated bearer link the proxy has no way to revoke. The proxy
  # (proxy/index.js) verifies the same signature with the same secret - PREVIEW_ACCESS_TOKEN_SECRET must be set
  # identically on both. Deliberately a separate secret from internal-service.shared-secret: one signs a browser-
  # facing, comparatively low-stakes token, the other authenticates full machine-to-machine API access - a leak of
  # one shouldn't compromise the other.
  access-token-secret: ${PREVIEW_ACCESS_TOKEN_SECRET}
  access-token-ttl: 6h
  port-forward:
    # Only one process should hold the local port-forwards into the kind cluster's Redis/proxy pods at a time.
    # Off by default: the standalone k8s/dev-port-forward scripts hold them (docs/local-development/). Set
    # true to have this service's PreviewPortForwarder open them itself instead - never both.
    enabled: false

client.url: http://localhost:5173

server:
  port: ${WORKSPACE_SERVICE_PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
